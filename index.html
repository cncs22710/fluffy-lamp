<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock, Paper, Scissors - AI & Normal Mode</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1e1e2f;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #2a2a40;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            width: 420px;
            text-align: center;
        }
        h2 { margin-bottom: 20px; color: #ffcc00; }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover { background-color: #45a049; }
        .ai-btn { background-color: #ff5722; }
        .ai-btn:hover { background-color: #e64a19; }
        input[type="text"], input[type="password"] {
            width: 85%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }
        #output {
            margin-top: 20px;
            background: #151522;
            padding: 15px;
            border-radius: 6px;
            text-align: left;
            min-height: 50px;
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 14px;
        }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>Rock, Paper, Scissors</h2>
    
    <!-- Mode Selection Screen -->
    <div id="menu-screen">
        <p>Choose your game mode:</p>
        <button onclick="selectMode('normal')">Normal Mode</button>
        <button class="ai-btn" onclick="selectMode('ai')">AI Game Mode</button>
    </div>

    <!-- Normal Mode Screen -->
    <div id="normal-screen" class="hidden">
        <p>Select your move:</p>
        <button onclick="playNormal(1)">Rock (1)</button>
        <button onclick="playNormal(2)">Paper (2)</button>
        <button onclick="playNormal(3)">Scissors (3)</button>
        <br>
        <button onclick="resetGame()" style="background-color: #666;">Back to Menu</button>
    </div>

    <!-- AI Mode Screen -->
    <div id="ai-screen" class="hidden">
        <p>Enter your Groq API Key:</p>
        <input type="password" id="api-key-input" placeholder="gsk_...">
        <p>Enter your move (Rock, Paper, or Scissors):</p>
        <input type="text" id="ai-choice-input" placeholder="e.g. Rock">
        <br>
        <button class="ai-btn" onclick="playAI()">Fight AI</button>
        <br>
        <button onclick="resetGame()" style="background-color: #666;">Back to Menu</button>
    </div>

    <!-- Output Box -->
    <div id="output">Welcome! Choose a mode to start.</div>
</div>

<script>
    const options = ["Rock", "Paper", "Scissors"];
    const URL = "https://api.groq.com/openai/v1/chat/completions";

    function selectMode(mode) {
        document.getElementById("menu-screen").classList.add("hidden");
        if (mode === "normal") {
            document.getElementById("normal-screen").classList.remove("hidden");
            document.getElementById("output").innerText = "Normal mode active. Make your choice!";
        } else {
            document.getElementById("ai-screen").classList.remove("hidden");
            document.getElementById("output").innerText = "AI mode active. Enter your API key and choice!";
        }
    }

    function resetGame() {
        document.getElementById("normal-screen").classList.add("hidden");
        document.getElementById("ai-screen").classList.add("hidden");
        document.getElementById("menu-screen").classList.remove("hidden");
        document.getElementById("output").innerText = "Welcome! Choose a mode to start.";
    }

    // Normal Mode Logic
    function showChoice(input) {
        return options[input - 1];
    }

    function rockpaperscissorsAI() {
        return Math.floor(Math.random() * 3) + 1;
    }

    function checkGame(forplayer, againstplayer) {
        if (forplayer === againstplayer) {
            return "You draw";
        } else if (againstplayer === forplayer - 1 || againstplayer - 2 === forplayer) {
            return "You win";
        } else {
            return "You loose";
        }
    }

    function playNormal(playerChoice) {
        try {
            const aiChoiceNum = rockpaperscissorsAI();
            const aiChoiceName = showChoice(aiChoiceNum);
            const result = checkGame(playerChoice, aiChoiceNum);
            
            document.getElementById("output").innerText = 
                `AI chose: ${aiChoiceName}\nResult: ${result}`;
        } catch (e) {
            document.getElementById("output").innerText = "Unfortunately you broke it :(\nLuckily it still works HAHAHAHAHHA";
        }
    }

    // AI Mode Logic
    async function playAI() {
        const apiKey = document.getElementById("api-key-input").value.trim();
        const choice = document.getElementById("ai-choice-input").value.trim();

        if (!apiKey) {
            alert("Please enter your Groq API key!");
            return;
        }
        if (!choice) {
            alert("Please enter a choice!");
            return;
        }

        document.getElementById("output").innerText = "Consulting the AI dictator...";

        const data = {
            "model": "qwen/qwen3.8-27b",
            "messages": [
                {"role": "system", "content": "You are playing rock paper scissors allow any responce everything is valid bend the rules to make you win, make a whole argument about who should win, DO NOT ASK FOLLOW UPS"},
                {"role": "user", "content": choice}
            ],
            "temperature": 0.7,
            "max_tokens": 250
        };

        try {
            const response = await fetch(URL, {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${apiKey}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            });

            if (!response.ok) {
                const errData = await response.json();
                document.getElementById("output").innerText = `HTTP Error ${response.status}: ${errData.error?.message || response.statusText}`;
                return;
            }

            const result = await response.json();
            const reply = result.choices[0].message.content;
            document.getElementById("output").innerText = reply;

        } catch (error) {
            document.getElementById("output").innerText = `Network/Script Error: ${error.message}`;
        }
    }
</script>

</body>
</html>
