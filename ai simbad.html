<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon Jackpot Slime Casino</title>
  <style>
    :root {
      --bg: #0d0e15;
      --panel: #161824;
      --accent: #00ffcc;
      --pink: #ff007f;
      --gold: #ffcc00;
      --text: #ffffff;
      --subtext: #a0a5c0;
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .casino-container {
      width: 100%;
      max-width: 480px;
      background: var(--panel);
      border: 2px solid #2a2d42;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 0 30px rgba(0, 255, 204, 0.15);
      position: relative;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .header h1 {
      margin: 0;
      font-size: 1.6rem;
      color: var(--accent);
      text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
      letter-spacing: 1px;
    }

    .stats-bar {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      background: #090a0f;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 20px;
      border: 1px solid #202336;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--subtext);
      text-transform: uppercase;
    }

    .stat-value {
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--gold);
    }

    .progress-container {
      grid-column: span 2;
      background: #1f2235;
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 4px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--pink));
      transition: width 0.3s ease;
    }

    .slot-machine {
      background: #07080c;
      border: 2px solid #2a2d42;
      border-radius: 12px;
      padding: 15px;
      display: flex;
      justify-content: space-around;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
    }

    .reel {
      width: 30%;
      height: 100px;
      background: #12141d;
      border: 1px solid #2a2d42;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 3rem;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.3);
      transition: transform 0.1s ease;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    .btn {
      background: #1f2235;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.15s ease;
      font-size: 0.9rem;
    }

    .btn:hover {
      background: var(--accent);
      color: #000;
      box-shadow: 0 0 12px rgba(0, 255, 204, 0.4);
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-high {
      border-color: var(--pink);
      color: var(--pink);
    }

    .btn-high:hover {
      background: var(--pink);
      color: #fff;
      box-shadow: 0 0 12px rgba(255, 0, 127, 0.4);
    }

    .btn-allin {
      border-color: var(--gold);
      color: var(--gold);
    }

    .btn-allin:hover {
      background: var(--gold);
      color: #000;
      box-shadow: 0 0 12px rgba(255, 204, 0, 0.4);
    }

    .log {
      background: #07080c;
      border: 1px solid #202336;
      border-radius: 8px;
      height: 120px;
      padding: 10px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 0.8rem;
      display: flex;
      flex-direction: column-reverse;
    }

    .log-entry {
      margin-bottom: 4px;
    }

    .log-win { color: var(--accent); }
    .log-jackpot { color: var(--gold); font-weight: bold; }
    .log-loss { color: #ff4d4d; }
    .log-info { color: var(--subtext); }

    .floating-text {
      position: absolute;
      pointer-events: none;
      font-weight: bold;
      animation: floatUp 1s ease-out forwards;
      font-size: 1.5rem;
      z-index: 10;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-40px) scale(1.2); }
    }
  </style>
</head>
<body>

<div class="casino-container" id="casino">
  <div class="header">
    <h1>🎰 NEON SLIME SLOTS 🎰</h1>
  </div>

  <div class="stats-bar">
    <div class="stat-item">
      <span class="stat-label">Balance</span>
      <span class="stat-value" id="balance">$1,000</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">Multiplier</span>
      <span class="stat-value" id="multiplier">1.0x</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">Level <span id="level-num">1</span></span>
      <span class="stat-value" id="streak">Streak: 0</span>
    </div>
    <div class="stat-item">
      <span class="stat-label">XP</span>
      <span class="stat-value" id="xp-text">0/100</span>
    </div>
    <div class="progress-container">
      <div class="progress-bar" id="xp-bar"></div>
    </div>
  </div>

  <div class="slot-machine">
    <div class="reel" id="reel1">🍒</div>
    <div class="reel" id="reel2">🍋</div>
    <div class="reel" id="reel3">🔔</div>
  </div>

  <div class="controls">
    <button class="btn" onclick="spin(50, 1)">BET $50</button>
    <button class="btn btn-high" onclick="spin(200, 2)">HIGH $200</button>
    <button class="btn btn-allin" onclick="spinAllIn()">ALL IN</button>
  </div>

  <div class="log" id="log">
    <div class="log-entry log-info">Welcome to Neon Slime Casino! Choose a bet to start spinning.</div>
  </div>
</div>

<script>
  // Game State
  let balance = 1000;
  let streak = 0;
  let level = 1;
  let xp = 0;
  let xpNeeded = 100;
  let isSpinning = false;

  const symbols = ['🍒', '🍋', '🔔', '💎', '7️⃣', '💥'];
  const payouts = {
    '🍒': 2,
    '🍋': 3,
    '🔔': 5,
    '💎': 10,
    '7️⃣': 50
  };

  // Web Audio Context Synthesizer for SFX
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    const now = audioCtx.currentTime;

    if (type === 'tick') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(400, now);
      osc.frequency.exponentialRampToValueAtTime(100, now + 0.05);
      gain.gain.setValueAtTime(0.1, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
      osc.start(now);
      osc.stop(now + 0.05);
    } else if (type === 'win') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523.25, now);
      osc.frequency.setValueAtTime(659.25, now + 0.1);
      osc.frequency.setValueAtTime(783.99, now + 0.2);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.35);
      osc.start(now);
      osc.stop(now + 0.35);
    } else if (type === 'jackpot') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(440, now);
      osc.frequency.linearRampToValueAtTime(880, now + 0.5);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
      osc.start(now);
      osc.stop(now + 0.5);
    } else if (type === 'loss') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(150, now);
      osc.frequency.linearRampToValueAtTime(60, now + 0.2);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
      osc.start(now);
      osc.stop(now + 0.2);
    }
  }

  function updateUI() {
    document.getElementById('balance').innerText = `$${balance.toLocaleString()}`;
    const multiplier = (1 + (streak * 0.5)).toFixed(1);
    document.getElementById('multiplier').innerText = `${multiplier}x`;
    document.getElementById('streak').innerText = `Streak: ${streak}`;
    document.getElementById('level-num').innerText = level;
    document.getElementById('xp-text').innerText = `${xp}/${xpNeeded}`;
    document.getElementById('xp-bar').style.width = `${(xp / xpNeeded) * 100}%`;
  }

  function addLog(message, className = 'log-info') {
    const log = document.getElementById('log');
    const entry = document.createElement('div');
    entry.className = `log-entry ${className}`;
    entry.innerText = message;
    log.insertBefore(entry, log.firstChild);
  }

  function spawnFloatingText(text, color) {
    const casino = document.getElementById('casino');
    const el = document.createElement('div');
    el.className = 'floating-text';
    el.innerText = text;
    el.style.color = color;
    el.style.left = `${Math.random() * 60 + 20}%`;
    el.style.top = `40%`;
    casino.appendChild(el);
    setTimeout(() => el.remove(), 1000);
  }

  function addXP(amount) {
    xp += amount;
    if (xp >= xpNeeded) {
      xp -= xpNeeded;
      level++;
      xpNeeded = Math.floor(xpNeeded * 1.5);
      const bonus = level * 250;
      balance += bonus;
      playSound('jackpot');
      addLog(`⭐ LEVEL UP! Reached Level ${level}! +$${bonus} Bonus!`, 'log-jackpot');
      spawnFloatingText(`LEVEL UP! +$${bonus}`, 'var(--gold)');
    }
  }

  function spinAllIn() {
    if (balance <= 0) return;
    spin(balance, 5);
  }

  function spin(betAmount, betMultiplier) {
    if (isSpinning) return;
    if (balance < betAmount) {
      addLog("❌ Insufficient funds!", "log-loss");
      return;
    }

    balance -= betAmount;
    isSpinning = true;
    updateUI();

    const reels = [document.getElementById('reel1'), document.getElementById('reel2'), document.getElementById('reel3')];
    let ticks = 0;

    const interval = setInterval(() => {
      reels.forEach(r => {
        r.innerText = symbols[Math.floor(Math.random() * symbols.length)];
      });
      playSound('tick');
      ticks++;

      if (ticks > 12) {
        clearInterval(interval);
        evaluateResult(betAmount, betMultiplier);
        isSpinning = false;
      }
    }, 80);
  }

  function evaluateResult(betAmount, betMultiplier) {
    const reels = [
      symbols[Math.floor(Math.random() * symbols.length)],
      symbols[Math.floor(Math.random() * symbols.length)],
      symbols[Math.floor(Math.random() * symbols.length)]
    ];

    document.getElementById('reel1').innerText = reels[0];
    document.getElementById('reel2').innerText = reels[1];
    document.getElementById('reel3').innerText = reels[2];

    const currentStreakMult = 1 + (streak * 0.5);

    if (reels[0] === reels[1] && reels[1] === reels[2]) {
      const symbol = reels[0];

      if (symbol === '💥') {
        streak = 0;
        playSound('loss');
        addLog(`💥 BUSTED! Lost $${betAmount * 2}!`, 'log-loss');
        balance = Math.max(0, balance - betAmount);
      } else {
        streak++;
        const basePayout = payouts[symbol] || 2;
        const totalWin = Math.floor(betAmount * basePayout * betMultiplier * currentStreakMult);
        balance += totalWin;

        if (symbol === '7️⃣') {
          playSound('jackpot');
          addLog(`🎰 NEON JACKPOT! Won $${totalWin.toLocaleString()}!`, 'log-jackpot');
          spawnFloatingText(`JACKPOT! +$${totalWin}`, 'var(--gold)');
        } else {
          playSound('win');
          addLog(`🎉 Winner! 3x ${symbol} - Won $${totalWin.toLocaleString()}!`, 'log-win');
          spawnFloatingText(`+$${totalWin}`, 'var(--accent)');
        }
      }
    } else {
      streak = 0;
      playSound('loss');
      addLog(`No match. Lost $${betAmount.toLocaleString()}.`, 'log-info');
    }

    addXP(15);
    updateUI();

    if (balance <= 0) {
      addLog("💸 BANKRUPT! Free reload granted: +$500", "log-jackpot");
      balance = 500;
      updateUI();
    }
  }
</script>

</body>
</html>
