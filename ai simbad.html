<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Neon Slime Arcade & Casino</title>
  <style>
    :root {
      --bg: #0b0c10;
      --panel: #151821;
      --accent: #00ffcc;
      --pink: #ff007f;
      --gold: #ffcc00;
      --red: #ff3366;
      --text: #ffffff;
      --subtext: #8e95b2;
    }

    * { box-sizing: border-box; user-select: none; }

    body {
      margin: 0;
      padding: 20px;
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .casino-card {
      width: 100%;
      max-width: 520px;
      background: var(--panel);
      border: 2px solid #252a3b;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 0 35px rgba(0, 255, 204, 0.12);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .header h1 {
      margin: 0;
      font-size: 1.4rem;
      color: var(--accent);
      text-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
    }

    .balance-badge {
      background: #090a0f;
      border: 1px solid var(--gold);
      color: var(--gold);
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 1.1rem;
    }

    .tabs {
      display: flex;
      gap: 6px;
      background: #090a0f;
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--subtext);
      padding: 8px 0;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #000;
      box-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
    }

    .game-panel {
      display: none;
    }

    .game-panel.active {
      display: block;
    }

    /* SLOTS */
    .slot-machine {
      background: #08090d;
      border: 2px solid #222738;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      justify-content: space-around;
      margin-bottom: 16px;
    }

    .reel {
      width: 30%;
      height: 90px;
      background: #11131c;
      border: 1px solid #2a3045;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2.8rem;
    }

    /* CRASH */
    .crash-display {
      height: 180px;
      background: #08090d;
      border: 2px solid #222738;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      margin-bottom: 16px;
      overflow: hidden;
    }

    .crash-mult {
      font-size: 3.5rem;
      font-weight: 900;
      color: var(--accent);
      text-shadow: 0 0 20px rgba(0, 255, 204, 0.5);
    }

    .crash-status {
      font-size: 0.9rem;
      color: var(--subtext);
      margin-top: 6px;
    }

    /* MINES */
    .mines-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .mine-tile {
      aspect-ratio: 1;
      background: #11131c;
      border: 1px solid #2a3045;
      border-radius: 8px;
      font-size: 1.5rem;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: all 0.15s;
    }

    .mine-tile:hover {
      border-color: var(--accent);
      background: #1a1e2d;
    }

    .mine-tile.revealed {
      background: #08090d;
      cursor: default;
    }

    /* CONTROLS & LOG */
    .bet-control {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .bet-input {
      flex: 1;
      background: #08090d;
      border: 1px solid #222738;
      color: #fff;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
    }

    .btn {
      background: #1e2233;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 12px 18px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.15s;
      font-size: 0.9rem;
    }

    .btn:hover {
      background: var(--accent);
      color: #000;
      box-shadow: 0 0 12px rgba(0, 255, 204, 0.4);
    }

    .btn-action {
      width: 100%;
      background: var(--accent);
      color: #000;
      font-size: 1.1rem;
      padding: 14px;
    }

    .btn-action:hover {
      background: #33ffd6;
    }

    .btn-danger {
      border-color: var(--red);
      color: var(--red);
    }

    .btn-danger:hover {
      background: var(--red);
      color: #fff;
    }

    .log {
      background: #08090d;
      border: 1px solid #222738;
      border-radius: 8px;
      height: 90px;
      padding: 10px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 0.8rem;
      display: flex;
      flex-direction: column-reverse;
    }

    .log-win { color: var(--accent); }
    .log-loss { color: var(--red); }
    .log-info { color: var(--subtext); }
  </style>
</head>
<body>

<div class="casino-card">
  <div class="header">
    <h1>🧪 NEON CASINO</h1>
    <div class="balance-badge" id="balance">$1,000</div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchGame('slots')">🎰 SLOTS</button>
    <button class="tab-btn" onclick="switchGame('crash')">📈 CRASH</button>
    <button class="tab-btn" onclick="switchGame('mines')">💣 MINES</button>
    <button class="tab-btn" onclick="switchGame('flip')">🪙 FLIP</button>
  </div>

  <!-- SLOTS PANEL -->
  <div id="game-slots" class="game-panel active">
    <div class="slot-machine">
      <div class="reel" id="r1">🍒</div>
      <div class="reel" id="r2">🍋</div>
      <div class="reel" id="r3">💎</div>
    </div>
    <div class="bet-control">
      <input type="number" id="slots-bet" class="bet-input" value="50" min="10" step="10" />
      <button class="btn btn-action" onclick="spinSlots()">SPIN</button>
    </div>
  </div>

  <!-- CRASH PANEL -->
  <div id="game-crash" class="game-panel">
    <div class="crash-display">
      <div class="crash-mult" id="crash-mult">1.00x</div>
      <div class="crash-status" id="crash-status">Set bet & start launch</div>
    </div>
    <div class="bet-control">
      <input type="number" id="crash-bet" class="bet-input" value="50" min="10" step="10" />
      <button class="btn btn-action" id="crash-btn" onclick="toggleCrash()">START LAUNCH</button>
    </div>
  </div>

  <!-- MINES PANEL -->
  <div id="game-mines" class="game-panel">
    <div class="mines-grid" id="mines-grid"></div>
    <div class="bet-control">
      <input type="number" id="mines-bet" class="bet-input" value="50" min="10" step="10" />
      <button class="btn btn-action" id="mines-btn" onclick="startMines()">START GAME ($50)</button>
    </div>
  </div>

  <!-- FLIP PANEL -->
  <div id="game-flip" class="game-panel">
    <div class="slot-machine" style="justify-content: center; gap: 20px;">
      <div class="reel" id="flip-coin" style="width: 120px; height: 120px; font-size: 4rem;">🪙</div>
    </div>
    <div class="bet-control">
      <input type="number" id="flip-bet" class="bet-input" value="50" min="10" step="10" />
      <button class="btn" style="flex:1" onclick="playFlip('HEADS')">HEADS</button>
      <button class="btn" style="flex:1" onclick="playFlip('TAILS')">TAILS</button>
    </div>
  </div>

  <div class="log" id="log">
    <div class="log-entry log-info">Welcome! Choose a game and start playing.</div>
  </div>
</div>

<script>
  let balance = 1000;
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  function playSFX(freq, duration, type='sine') {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  }

  function updateBalance(amt) {
    balance += amt;
    document.getElementById('balance').innerText = `$${balance.toLocaleString()}`;
    if (balance <= 0) {
      balance = 250;
      addLog("💸 Bankrupt! Granted +$250 relief fund.", "log-loss");
      document.getElementById('balance').innerText = `$${balance.toLocaleString()}`;
    }
  }

  function addLog(msg, type='log-info') {
    const log = document.getElementById('log');
    const el = document.createElement('div');
    el.className = `log-entry ${type}`;
    el.innerText = msg;
    log.insertBefore(el, log.firstChild);
  }

  function switchGame(gameKey) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.game-panel').forEach(p => p.classList.remove('active'));
    
    event.target.classList.add('active');
    document.getElementById(`game-${gameKey}`).classList.add('active');
  }

  /* --- 1. SLOTS GAME --- */
  const slotSymbols = ['🍒', '🍋', '🔔', '💎', '7️⃣'];
  let isSpinning = false;

  function spinSlots() {
    if (isSpinning) return;
    const bet = parseInt(document.getElementById('slots-bet').value) || 50;
    if (balance < bet) return addLog("Insufficient balance!", "log-loss");

    updateBalance(-bet);
    isSpinning = true;
    let ticks = 0;

    const interval = setInterval(() => {
      document.getElementById('r1').innerText = slotSymbols[Math.floor(Math.random() * slotSymbols.length)];
      document.getElementById('r2').innerText = slotSymbols[Math.floor(Math.random() * slotSymbols.length)];
      document.getElementById('r3').innerText = slotSymbols[Math.floor(Math.random() * slotSymbols.length)];
      playSFX(300, 0.05, 'triangle');
      ticks++;

      if (ticks > 10) {
        clearInterval(interval);
        isSpinning = false;
        
        // Boosted High Odds Logic: 60% chance to land match
        const winRoll = Math.random();
        let s1, s2, s3;
        if (winRoll < 0.60) {
          const sym = slotSymbols[Math.floor(Math.random() * slotSymbols.length)];
          s1 = s2 = s3 = sym;
        } else {
          s1 = slotSymbols[Math.floor(Math.random() * slotSymbols.length)];
          s2 = slotSymbols[Math.floor(Math.random() * slotSymbols.length)];
          s3 = slotSymbols[Math.floor(Math.random() * slotSymbols.length)];
        }

        document.getElementById('r1').innerText = s1;
        document.getElementById('r2').innerText = s2;
        document.getElementById('r3').innerText = s3;

        if (s1 === s2 && s2 === s3) {
          const win = bet * 4;
          updateBalance(win);
          playSFX(600, 0.3);
          addLog(`🎉 SLOTS WIN! Matched 3x ${s1} - Won $${win}!`, 'log-win');
        } else {
          playSFX(150, 0.2, 'sawtooth');
          addLog(`Slots Loss (-$${bet})`, 'log-loss');
        }
      }
    }, 80);
  }

  /* --- 2. CRASH GAME --- */
  let crashActive = false;
  let crashMult = 1.00;
  let crashTimer = null;
  let crashPoint = 0;
  let crashBet = 0;

  function toggleCrash() {
    const btn = document.getElementById('crash-btn');
    if (!crashActive) {
      // Start Game
      crashBet = parseInt(document.getElementById('crash-bet').value) || 50;
      if (balance < crashBet) return addLog("Insufficient balance!", "log-loss");

      updateBalance(-crashBet);
      crashActive = true;
      crashMult = 1.00;
      crashPoint = (Math.random() * 8 + 1.2).toFixed(2); // High odds crash point
      
      btn.innerText = "CASH OUT";
      btn.classList.add('btn-danger');
      document.getElementById('crash-status').innerText = "Multiplier rising...";

      crashTimer = setInterval(() => {
        crashMult += 0.03;
        document.getElementById('crash-mult').innerText = `${crashMult.toFixed(2)}x`;
        playSFX(200 + (crashMult * 50), 0.04);

        if (crashMult >= crashPoint) {
          // Crashed!
          clearInterval(crashTimer);
          crashActive = false;
          playSFX(100, 0.4, 'sawtooth');
          document.getElementById('crash-status').innerText = `CRASHED @ ${crashPoint}x!`;
          addLog(`💥 Crash BUSTED at ${crashPoint}x (-$${crashBet})`, 'log-loss');
          btn.innerText = "START LAUNCH";
          btn.classList.remove('btn-danger');
        }
      }, 100);
    } else {
      // Cash Out
      clearInterval(crashTimer);
      crashActive = false;
      const payout = Math.floor(crashBet * crashMult);
      updateBalance(payout);
      playSFX(800, 0.3);
      document.getElementById('crash-status').innerText = `Cashed out @ ${crashMult.toFixed(2)}x!`;
      addLog(`📈 CASH OUT! Won $${payout} @ ${crashMult.toFixed(2)}x`, 'log-win');
      btn.innerText = "START LAUNCH";
      btn.classList.remove('btn-danger');
    }
  }

  /* --- 3. MINES GAME --- */
  let minesActive = false;
  let mineLocations = [];
  let minesBet = 0;
  let gemsFound = 0;

  function initMinesGrid() {
    const grid = document.getElementById('mines-grid');
    grid.innerHTML = '';
    for (let i = 0; i < 25; i++) {
      const tile = document.createElement('div');
      tile.className = 'mine-tile';
      tile.innerText = '❓';
      tile.onclick = () => revealMine(i, tile);
      grid.appendChild(tile);
    }
  }

  function startMines() {
    minesBet = parseInt(document.getElementById('mines-bet').value) || 50;
    if (balance < minesBet) return addLog("Insufficient balance!", "log-loss");

    updateBalance(-minesBet);
    minesActive = true;
    gemsFound = 0;
    mineLocations = [];

    // Place 3 mines
    while (mineLocations.length < 3) {
      let rand = Math.floor(Math.random() * 25);
      if (!mineLocations.includes(rand)) mineLocations.push(rand);
    }

    initMinesGrid();
    const btn = document.getElementById('mines-btn');
    btn.innerText = "CASH OUT ($0)";
    btn.onclick = cashOutMines;
    addLog(`💣 Mines active! Click tiles to find gems.`, 'log-info');
  }

  function revealMine(index, tile) {
    if (!minesActive || tile.classList.contains('revealed')) return;

    tile.classList.add('revealed');
    if (mineLocations.includes(index)) {
      // Hit Mine
      tile.innerText = '💥';
      playSFX(120, 0.4, 'sawtooth');
      minesActive = false;
      addLog(`💣 BOOM! Hit a mine. Lost $${minesBet}.`, 'log-loss');
      resetMinesBtn();
    } else {
      // Hit Gem
      tile.innerText = '💎';
      gemsFound++;
      playSFX(400 + (gemsFound * 60), 0.1);
      const currentWin = Math.floor(minesBet * (1 + gemsFound * 0.4));
      document.getElementById('mines-btn').innerText = `CASH OUT ($${currentWin})`;
    }
  }

  function cashOutMines() {
    if (!minesActive || gemsFound === 0) return;
    const currentWin = Math.floor(minesBet * (1 + gemsFound * 0.4));
    updateBalance(currentWin);
    playSFX(700, 0.3);
    addLog(`💎 MINES CASH OUT! Won $${currentWin}`, 'log-win');
    minesActive = false;
    resetMinesBtn();
  }

  function resetMinesBtn() {
    const btn = document.getElementById('mines-btn');
    btn.innerText = "START GAME";
    btn.onclick = startMines;
  }

  /* --- 4. COIN FLIP GAME --- */
  function playFlip(choice) {
    const bet = parseInt(document.getElementById('flip-bet').value) || 50;
    if (balance < bet) return addLog("Insufficient balance!", "log-loss");

    updateBalance(-bet);
    const coinEl = document.getElementById('flip-coin');
    let rolls = 0;

    const interval = setInterval(() => {
      coinEl.innerText = rolls % 2 === 0 ? '🪙' : '👑';
      playSFX(400, 0.04);
      rolls++;

      if (rolls > 8) {
        clearInterval(interval);
        const result = Math.random() < 0.55 ? choice : (choice === 'HEADS' ? 'TAILS' : 'HEADS');
        coinEl.innerText = result === 'HEADS' ? '🪙' : '👑';

        if (result === choice) {
          const win = bet * 2;
          updateBalance(win);
          playSFX(650, 0.25);
          addLog(`🪙 FLIP WIN! Landed ${result} - Won $${win}!`, 'log-win');
        } else {
          playSFX(160, 0.2, 'sawtooth');
          addLog(`🪙 Landed ${result}. Lost $${bet}.`, 'log-loss');
        }
      }
    }, 70);
  }

  // Initialize
  initMinesGrid();
</script>

</body>
</html>
