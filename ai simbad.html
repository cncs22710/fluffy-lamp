<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Neon Slime Arcade & Multiplayer Casino</title>
  <style>
    :root {
      --bg: #0b0c10;
      --panel: #151821;
      --accent: #00ffcc;
      --pink: #ff007f;
      --gold: #ffcc00;
      --red: #ff3366;
      --text: #ffffff;
      --subtext: #8e95b2;
    }

    * { box-sizing: border-box; user-select: none; }

    body {
      margin: 0;
      padding: 20px;
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .casino-card {
      width: 100%;
      max-width: 540px;
      background: var(--panel);
      border: 2px solid #252a3b;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 0 35px rgba(0, 255, 204, 0.12);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .header h1 {
      margin: 0;
      font-size: 1.3rem;
      color: var(--accent);
      text-shadow: 0 0 10px rgba(0, 255, 204, 0.4);
    }

    .balance-badge {
      background: #090a0f;
      border: 1px solid var(--gold);
      color: var(--gold);
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 1.1rem;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      background: #090a0f;
      padding: 6px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1 1 30%;
      background: transparent;
      border: none;
      color: var(--subtext);
      padding: 8px 4px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.75rem;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #000;
      box-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
    }

    .game-panel {
      display: none;
    }

    .game-panel.active {
      display: block;
    }

    /* COMMON COMPONENTS */
    .slot-machine {
      background: #08090d;
      border: 2px solid #222738;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      justify-content: space-around;
      margin-bottom: 16px;
    }

    .reel {
      width: 30%;
      height: 90px;
      background: #11131c;
      border: 1px solid #2a3045;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 2.8rem;
    }

    .bet-control {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .bet-input {
      flex: 1;
      background: #08090d;
      border: 1px solid #222738;
      color: #fff;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
    }

    .btn {
      background: #1e2233;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 12px 18px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.15s;
      font-size: 0.9rem;
    }

    .btn:hover {
      background: var(--accent);
      color: #000;
      box-shadow: 0 0 12px rgba(0, 255, 204, 0.4);
    }

    .btn-action {
      width: 100%;
      background: var(--accent);
      color: #000;
      font-size: 1.1rem;
      padding: 14px;
    }

    .btn-action:hover {
      background: #33ffd6;
    }

    .btn-danger {
      border-color: var(--red);
      color: var(--red);
    }

    .btn-danger:hover {
      background: var(--red);
      color: #fff;
    }

    /* CRASH */
    .crash-display {
      height: 160px;
      background: #08090d;
      border: 2px solid #222738;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin-bottom: 16px;
    }
    .crash-mult { font-size: 3rem; font-weight: 900; color: var(--accent); }
    .crash-status { font-size: 0.85rem; color: var(--subtext); margin-top: 6px; }

    /* MINES */
    .mines-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-bottom: 16px;
    }
    .mine-tile {
      aspect-ratio: 1;
      background: #11131c;
      border: 1px solid #2a3045;
      border-radius: 6px;
      font-size: 1.2rem;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }
    .mine-tile.revealed { background: #08090d; cursor: default; }

    /* ROULETTE */
    .roulette-display {
      background: #08090d;
      border: 2px solid #222738;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      font-size: 2.2rem;
      font-weight: bold;
      margin-bottom: 16px;
      color: var(--gold);
    }

    /* MULTIPLAYER / WEBRTC */
    .p2p-box {
      background: #08090d;
      border: 1px solid #222738;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 12px;
      font-size: 0.85rem;
    }
    .p2p-box textarea {
      width: 100%;
      height: 60px;
      background: #12141f;
      border: 1px solid #2a3045;
      color: #fff;
      border-radius: 6px;
      padding: 6px;
      font-family: monospace;
      font-size: 0.75rem;
      resize: none;
      margin-top: 6px;
    }

    .log {
      background: #08090d;
      border: 1px solid #222738;
      border-radius: 8px;
      height: 80px;
      padding: 8px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 0.75rem;
      display: flex;
      flex-direction: column-reverse;
      margin-top: 14px;
    }
    .log-win { color: var(--accent); }
    .log-loss { color: var(--red); }
    .log-info { color: var(--subtext); }
  </style>
</head>
<body>

<div class="casino-card">
  <div class="header">
    <h1>🧪 NEON ARCADE & P2P</h1>
    <div class="balance-badge" id="balance">$1,000</div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchGame('slots')">🎰 SLOTS</button>
    <button class="tab-btn" onclick="switchGame('crash')">📈 CRASH</button>
    <button class="tab-btn" onclick="switchGame('mines')">💣 MINES</button>
    <button class="tab-btn" onclick="switchGame('flip')">🪙 FLIP</button>
    <button class="tab-btn" onclick="switchGame('plinko')">🔻 PLINKO</button>
    <button class="tab-btn" onclick="switchGame('roulette')">🎡 ROULETTE</button>
    <button class="tab-btn" onclick="switchGame('p2p')" style="border-color:var(--pink); color:var(--pink);">🤝 1V1 P2P</button>
  </div>

  <!-- SLOTS -->
  <div id="game-slots" class="game-panel active">
    <div class="slot-machine">
      <div class="reel" id="r1">🍒</div>
      <div class="reel" id="r2">🍋</div>
      <div class="reel" id="r3">💎</div>
    </div>
    <div class="bet-control">
      <input type="number" id="slots-bet" class="bet-input" value="50" min="10" step="10" />
      <button class="btn btn-action" onclick="spinSlots()">SPIN</button>
    </div>
  </div>

  <!-- CRASH -->
  <div id="game-crash" class="game-panel">
    <div class="crash-display">
      <div class="crash-mult" id="crash-mult">1.00x</div>
      <div class="crash-status" id="crash-status">Ready to launch</div>
    </div>
    <div class="bet-control">
      <input type="number" id="crash-bet" class="bet-input" value="50" min="10" step="10" />
      <button class="btn btn-action" id="crash-btn" onclick="toggleCrash()">START LAUNCH</button>
    </div>
  </div>

  <!-- MINES -->
  <div id="game-mines" class="game-panel">
    <div class="mines-grid" id="mines-grid"></div>
    <div class="bet-control">
      <input type="number" id="mines-bet" class="bet-input" value="50" min="10" step="10" />
      <button class="btn btn-action" id="mines-btn" onclick="startMines()">START MINES ($50)</button>
    </div>
  </div>

  <!-- FLIP -->
  <div id="game-flip" class="game-panel">
    <div class="slot-machine" style="justify-content: center;">
      <div class="reel" id="flip-coin" style="width: 100px; height: 100px; font-size: 3.5rem;">🪙</div>
    </div>
    <div class="bet-control">
      <input type="number" id="flip-bet" class="bet-input" value="50" min="10" step="10" />
      <button class="btn" style="flex:1" onclick="playFlip('HEADS')">HEADS</button>
      <button class="btn" style="flex:1" onclick="playFlip('TAILS')">TAILS</button>
    </div>
  </div>

  <!-- PLINKO -->
  <div id="game-plinko" class="game-panel">
    <div class="crash-display" style="height: 120px;">
      <div style="font-size: 1.1rem; color: var(--subtext); margin-bottom: 8px;">PLINKO PYRAMID</div>
      <div id="plinko-result" style="font-size: 2rem; font-weight: bold; color: var(--accent);">Drop a Slime Ball!</div>
    </div>
    <div class="bet-control">
      <input type="number" id="plinko-bet" class="bet-input" value="50" min="10" step="10" />
      <button class="btn btn-action" onclick="playPlinko()">DROP BALL</button>
    </div>
  </div>

  <!-- ROULETTE -->
  <div id="game-roulette" class="game-panel">
    <div class="roulette-display" id="roulette-screen">GREEN (0) - 35x</div>
    <div class="bet-control">
      <input type="number" id="roul-bet" class="bet-input" value="50" min="10" step="10" />
    </div>
    <div class="bet-control">
      <button class="btn" style="flex:1; border-color:var(--red); color:var(--red);" onclick="playRoulette('RED')">RED (2x)</button>
      <button class="btn" style="flex:1; border-color:#fff; color:#fff;" onclick="playRoulette('BLACK')">BLACK (2x)</button>
      <button class="btn" style="flex:1; border-color:var(--accent); color:var(--accent);" onclick="playRoulette('GREEN')">GREEN (35x)</button>
    </div>
  </div>

  <!-- MULTIPLAYER P2P -->
  <div id="game-p2p" class="game-panel">
    <div style="font-size:0.85rem; color:var(--subtext); margin-bottom:8px;">Head-to-Head Coin Flip 1v1 Battle</div>
    <div class="p2p-box">
      <b>Step 1: Host / Join Connection</b>
      <div style="display:flex; gap:6px; margin-top:6px;">
        <button class="btn" style="flex:1; font-size:0.75rem;" onclick="p2pHost()">1. Generate Host Token</button>
        <button class="btn" style="flex:1; font-size:0.75rem;" onclick="p2pJoin()">3. Connect via Peer Token</button>
      </div>
      <textarea id="p2p-output" placeholder="Your offer token will appear here to send to friend..." readonly></textarea>
      <textarea id="p2p-input" placeholder="Paste friend's token here..."></textarea>
    </div>
    <div class="bet-control" style="margin-top:10px;">
      <input type="number" id="p2p-wager" class="bet-input" value="50" />
      <button class="btn btn-action" id="p2p-battle-btn" onclick="p2pBattle()" disabled>1V1 BATTLE ($50)</button>
    </div>
    <div id="p2p-status" style="font-size: 0.8rem; color: var(--pink); text-align: center;">Status: Disconnected</div>
  </div>

  <div class="log" id="log">
    <div class="log-entry log-info">Welcome to Neon Casino! Pick a game or open P2P to play a friend.</div>
  </div>
</div>

<script>
  let balance = 1000;
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  function playSFX(freq, duration, type='sine') {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  }

  function updateBalance(amt) {
    balance += amt;
    document.getElementById('balance').innerText = `$${balance.toLocaleString()}`;
    if (balance <= 0) {
      balance = 250;
      addLog("💸 Bankrupt! Granted +$250 relief fund.", "log-loss");
      document.getElementById('balance').innerText = `$${balance.toLocaleString()}`;
    }
  }

  function addLog(msg, type='log-info') {
    const log = document.getElementById('log');
    const el = document.createElement('div');
    el.className = `log-entry ${type}`;
    el.innerText = msg;
    log.insertBefore(el, log.firstChild);
  }

  function switchGame(gameKey) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.game-panel').forEach(p => p.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById(`game-${gameKey}`).classList.add('active');
  }

  /* 1. SLOTS */
  const slotSymbols = ['🍒', '🍋', '🔔', '💎', '7️⃣'];
  let isSpinning = false;
  function spinSlots() {
    if (isSpinning) return;
    const bet = parseInt(document.getElementById('slots-bet').value) || 50;
    if (balance < bet) return addLog("Insufficient balance!", "log-loss");
    updateBalance(-bet);
    isSpinning = true;
    let ticks = 0;
    const interval = setInterval(() => {
      document.getElementById('r1').innerText = slotSymbols[Math.floor(Math.random() * slotSymbols.length)];
      document.getElementById('r2').innerText = slotSymbols[Math.floor(Math.random() * slotSymbols.length)];
      document.getElementById('r3').innerText = slotSymbols[Math.floor(Math.random() * slotSymbols.length)];
      playSFX(300, 0.04, 'triangle');
      ticks++;
      if (ticks > 10) {
        clearInterval(interval);
        isSpinning = false;
        const winRoll = Math.random();
        let s1, s2, s3;
        if (winRoll < 0.55) {
          s1 = s2 = s3 = slotSymbols[Math.floor(Math.random() * slotSymbols.length)];
        } else {
          s1 = slotSymbols[Math.floor(Math.random() * slotSymbols.length)];
          s2 = slotSymbols[Math.floor(Math.random() * slotSymbols.length)];
          s3 = slotSymbols[Math.floor(Math.random() * slotSymbols.length)];
        }
        document.getElementById('r1').innerText = s1;
        document.getElementById('r2').innerText = s2;
        document.getElementById('r3').innerText = s3;
        if (s1 === s2 && s2 === s3) {
          const win = bet * 4;
          updateBalance(win);
          playSFX(600, 0.3);
          addLog(`🎉 SLOTS WIN! Matched 3x ${s1} - Won $${win}!`, 'log-win');
        } else {
          playSFX(150, 0.2, 'sawtooth');
          addLog(`Slots Loss (-$${bet})`, 'log-loss');
        }
      }
    }, 80);
  }

  /* 2. CRASH */
  let crashActive = false, crashMult = 1.00, crashTimer = null, crashPoint = 0, crashBet = 0;
  function toggleCrash() {
    const btn = document.getElementById('crash-btn');
    if (!crashActive) {
      crashBet = parseInt(document.getElementById('crash-bet').value) || 50;
      if (balance < crashBet) return addLog("Insufficient balance!", "log-loss");
      updateBalance(-crashBet);
      crashActive = true;
      crashMult = 1.00;
      crashPoint = (Math.random() * 7 + 1.2).toFixed(2);
      btn.innerText = "CASH OUT";
      btn.classList.add('btn-danger');
      document.getElementById('crash-status').innerText = "Multiplier rising...";
      crashTimer = setInterval(() => {
        crashMult += 0.03;
        document.getElementById('crash-mult').innerText = `${crashMult.toFixed(2)}x`;
        playSFX(200 + (crashMult * 40), 0.04);
        if (crashMult >= crashPoint) {
          clearInterval(crashTimer);
          crashActive = false;
          playSFX(100, 0.4, 'sawtooth');
          document.getElementById('crash-status').innerText = `CRASHED @ ${crashPoint}x!`;
          addLog(`💥 Crash BUSTED at ${crashPoint}x (-$${crashBet})`, 'log-loss');
          btn.innerText = "START LAUNCH";
          btn.classList.remove('btn-danger');
        }
      }, 100);
    } else {
      clearInterval(crashTimer);
      crashActive = false;
      const payout = Math.floor(crashBet * crashMult);
      updateBalance(payout);
      playSFX(800, 0.3);
      document.getElementById('crash-status').innerText = `Cashed out @ ${crashMult.toFixed(2)}x!`;
      addLog(`📈 CASH OUT! Won $${payout} @ ${crashMult.toFixed(2)}x`, 'log-win');
      btn.innerText = "START LAUNCH";
      btn.classList.remove('btn-danger');
    }
  }

  /* 3. MINES */
  let minesActive = false, mineLocations = [], minesBet = 0, gemsFound = 0;
  function initMinesGrid() {
    const grid = document.getElementById('mines-grid');
    grid.innerHTML = '';
    for (let i = 0; i < 25; i++) {
      const tile = document.createElement('div');
      tile.className = 'mine-tile';
      tile.innerText = '❓';
      tile.onclick = () => revealMine(i, tile);
      grid.appendChild(tile);
    }
  }
  function startMines() {
    minesBet = parseInt(document.getElementById('mines-bet').value) || 50;
    if (balance < minesBet) return addLog("Insufficient balance!", "log-loss");
    updateBalance(-minesBet);
    minesActive = true;
    gemsFound = 0;
    mineLocations = [];
    while (mineLocations.length < 3) {
      let rand = Math.floor(Math.random() * 25);
      if (!mineLocations.includes(rand)) mineLocations.push(rand);
    }
    initMinesGrid();
    document.getElementById('mines-btn').innerText = "CASH OUT ($0)";
    document.getElementById('mines-btn').onclick = cashOutMines;
    addLog(`💣 Mines active! Click tiles.`, 'log-info');
  }
  function revealMine(index, tile) {
    if (!minesActive || tile.classList.contains('revealed')) return;
    tile.classList.add('revealed');
    if (mineLocations.includes(index)) {
      tile.innerText = '💥';
      playSFX(120, 0.4, 'sawtooth');
      minesActive = false;
      addLog(`💣 BOOM! Hit a mine. Lost $${minesBet}.`, 'log-loss');
      resetMinesBtn();
    } else {
      tile.innerText = '💎';
      gemsFound++;
      playSFX(400 + (gemsFound * 50), 0.1);
      const currentWin = Math.floor(minesBet * (1 + gemsFound * 0.4));
      document.getElementById('mines-btn').innerText = `CASH OUT ($${currentWin})`;
    }
  }
  function cashOutMines() {
    if (!minesActive || gemsFound === 0) return;
    const currentWin = Math.floor(minesBet * (1 + gemsFound * 0.4));
    updateBalance(currentWin);
    playSFX(700, 0.3);
    addLog(`💎 MINES CASH OUT! Won $${currentWin}`, 'log-win');
    minesActive = false;
    resetMinesBtn();
  }
  function resetMinesBtn() {
    const btn = document.getElementById('mines-btn');
    btn.innerText = "START MINES";
    btn.onclick = startMines;
  }

  /* 4. COIN FLIP */
  function playFlip(choice) {
    const bet = parseInt(document.getElementById('flip-bet').value) || 50;
    if (balance < bet) return addLog("Insufficient balance!", "log-loss");
    updateBalance(-bet);
    const coinEl = document.getElementById('flip-coin');
    let rolls = 0;
    const interval = setInterval(() => {
      coinEl.innerText = rolls % 2 === 0 ? '🪙' : '👑';
      playSFX(400, 0.03);
      rolls++;
      if (rolls > 8) {
        clearInterval(interval);
        const result = Math.random() < 0.55 ? choice : (choice === 'HEADS' ? 'TAILS' : 'HEADS');
        coinEl.innerText = result === 'HEADS' ? '🪙' : '👑';
        if (result === choice) {
          const win = bet * 2;
          updateBalance(win);
          playSFX(650, 0.25);
          addLog(`🪙 FLIP WIN! Landed ${result} - Won $${win}!`, 'log-win');
        } else {
          playSFX(160, 0.2, 'sawtooth');
          addLog(`🪙 Landed ${result}. Lost $${bet}.`, 'log-loss');
        }
      }
    }, 70);
  }

  /* 5. PLINKO */
  function playPlinko() {
    const bet = parseInt(document.getElementById('plinko-bet').value) || 50;
    if (balance < bet) return addLog("Insufficient balance!", "log-loss");
    updateBalance(-bet);
    const mults = [0.2, 0.5, 1.2, 2.5, 5.0, 10.0];
    const pickedMult = mults[Math.floor(Math.random() * mults.length)];
    const payout = Math.floor(bet * pickedMult);
    updateBalance(payout);
    playSFX(pickedMult >= 2 ? 700 : 300, 0.2);
    document.getElementById('plinko-result').innerText = `${pickedMult}x ($${payout})`;
    addLog(`🔻 Plinko landed on ${pickedMult}x! Payout: $${payout}`, pickedMult >= 1 ? 'log-win' : 'log-loss');
  }

  /* 6. ROULETTE */
  function playRoulette(choice) {
    const bet = parseInt(document.getElementById('roul-bet').value) || 50;
    if (balance < bet) return addLog("Insufficient balance!", "log-loss");
    updateBalance(-bet);
    const outcomes = ['RED', 'RED', 'BLACK', 'BLACK', 'GREEN'];
    const result = outcomes[Math.floor(Math.random() * outcomes.length)];
    document.getElementById('roulette-screen').innerText = `Landed: ${result}`;
    if (result === choice) {
      const multiplier = result === 'GREEN' ? 35 : 2;
      const payout = bet * multiplier;
      updateBalance(payout);
      playSFX(750, 0.3);
      addLog(`🎡 ROULETTE WIN! ${result} hit - Won $${payout}!`, 'log-win');
    } else {
      playSFX(150, 0.2, 'sawtooth');
      addLog(`🎡 Roulette landed on ${result}. Lost $${bet}.`, 'log-loss');
    }
  }

  /* 7. WEBRTC P2P 1V1 */
  let pc = null, dataChannel = null;
  const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

  function initPC() {
    if (pc) pc.close();
    pc = new RTCPeerConnection(rtcConfig);
  }

  async function p2pHost() {
    initPC();
    dataChannel = pc.createDataChannel("casino1v1");
    setupDataChannel();

    pc.onicecandidate = e => {
      if (!e.candidate) {
        document.getElementById('p2p-output').value = btoa(JSON.stringify(pc.localDescription));
      }
    };

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    document.getElementById('p2p-status').innerText = "Status: Offer generated. Send token to friend.";
  }

  async function p2pJoin() {
    initPC();
    pc.ondatachannel = e => {
      dataChannel = e.channel;
      setupDataChannel();
    };

    const token = document.getElementById('p2p-input').value.trim();
    if (!token) return alert("Paste host token first!");

    const offer = JSON.parse(atob(token));
    await pc.setRemoteDescription(offer);

    pc.onicecandidate = e => {
      if (!e.candidate) {
        document.getElementById('p2p-output').value = btoa(JSON.stringify(pc.localDescription));
      }
    };

    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    document.getElementById('p2p-status').innerText = "Status: Answer generated. Send token back to host.";
  }

  // If host receives answer string
  document.getElementById('p2p-input').onchange = async () => {
    if (pc && !pc.remoteDescription && document.getElementById('p2p-input').value.length > 50) {
      try {
        const answer = JSON.parse(atob(document.getElementById('p2p-input').value.trim()));
        await pc.setRemoteDescription(answer);
      } catch(e) {}
    }
  };

  function setupDataChannel() {
    dataChannel.onopen = () => {
      document.getElementById('p2p-status').innerText = "Status: Connected to Peer!";
      document.getElementById('p2p-battle-btn').disabled = false;
      addLog("🤝 P2P DataChannel established successfully!", "log-win");
    };
    dataChannel.onclose = () => {
      document.getElementById('p2p-status').innerText = "Status: Disconnected";
      document.getElementById('p2p-battle-btn').disabled = true;
    };
    dataChannel.onmessage = e => {
      const msg = JSON.parse(e.data);
      handleP2PMessage(msg);
    };
  }

  function p2pBattle() {
    const wager = parseInt(document.getElementById('p2p-wager').value) || 50;
    if (balance < wager) return addLog("Insufficient balance for battle!", "log-loss");
    updateBalance(-wager);

    const myRoll = Math.random();
    dataChannel.send(JSON.stringify({ type: 'roll', roll: myRoll, wager: wager }));
    addLog(`⚔️ 1v1 Battle initiated with wager $${wager}! Waiting for opponent roll...`, 'log-info');
    document.getElementById('p2p-battle-btn').disabled = true;
  }

  function handleP2PMessage(msg) {
    if (msg.type === 'roll') {
      const myRoll = Math.random();
      const wager = msg.wager;
      document.getElementById('p2p-battle-btn').disabled = false;

      addLog(`Opponent rolled: ${msg.roll.toFixed(3)} | Your roll: ${myRoll.toFixed(3)}`, 'log-info');
      if (myRoll > msg.roll) {
        const totalWin = wager * 2;
        updateBalance(totalWin);
        playSFX(800, 0.4);
        addLog(`🏆 1v1 VICTORY! Won $${totalWin}!`, 'log-win');
      } else {
        playSFX(120, 0.3, 'sawtooth');
        addLog(`💀 1v1 DEFEAT! Lost $${wager}.`, 'log-loss');
      }
    }
  }
</script>

</body>
